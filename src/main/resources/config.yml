starting-balance: 500.0
currency-name: Dollars
currency-symbol: "$"

menu:
  main-letters: "EcoSTG"

# Toggle hub buttons, commands, and related systems. Restart for ESC pause-menu buttons.
# economy: false also turns off auction, sell, pay, balance, moneytop, and jobs.
features:
  economy: true
  auction: true
  sell: true
  pay: true
  balance: true
  moneytop: true
  jobs: true
  homes: true
  tpa: true
  rtp: true
  friends: true
  stats: true
  leaderboards: true
  enderchest: true
  sit-lay: true
  settings: true
  combat: true
  gamemode: true

homes:
  max: 3

rtp:
  cooldown-seconds: 30
  # Search distance from the player (clamped to the world border).
  max-radius: 1500
  min-radius: 32
  max-attempts: 80

combat:
  # Seconds tagged after PvP (player hit by / hitting a player). Blocks home / TPA / RTP.
  # Operators are never tagged; the other player in a fight with an OP still is.
  duration-seconds: 15

auction:
  # Percent taken from the seller on a successful sale (money sink)
  sale-tax-percent: 5.0

jobs:
  # How many Minecraft days a worker has to deliver required items
  deadline-ingame-days: 4
  # Real-world days before a fired player can take a job again
  fire-cooldown-real-days: 30
  # Percent discount workers get when buying from the auction house
  ah-buyer-discount-percent: 8.0
  # Percent cheaper worker listings appear as (buyer pays less)
  worker-listing-discount-percent: 5.0

messages:
  # Notices use the action bar (above hotbar); no chat prefix / branding.
  economy-disabled: "<red>Your economy access is disabled.</red>"
  feature-disabled: "<red>That feature is disabled on this server.</red>"
  insufficient-funds: "<red>You do not have enough Dollars.</red>"
  player-not-found: "<red>Player not found.</red>"
  invalid-amount: "<red>Invalid amount.</red>"
