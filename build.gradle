group = 'com.ecostg'
version = '1.5.23'

tasks.register('buildAll') {
    group = 'build'
    description = 'Build EcoSTG jars for every Paper platform into builds/'
    dependsOn subprojects.collect { it.tasks.named('build') }
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean all platform modules and builds/'
    dependsOn subprojects.collect { it.tasks.named('clean') }
    doLast {
        delete file('builds')
    }
}
